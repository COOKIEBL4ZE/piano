<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>piano</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Piano keys</h1>
      <p>Type the letter to get a sound</p>
      <div>
        <div class="division">
          <div class="L key" data-freq="261.63">
            <p>Do</p>
            <p>a</p>
          </div>
          <div class="F key" data-freq="293.66">
            <p>Re</p>
            <p>s</p>
          </div>
          <div class="H key" data-freq="329.63">
            <p>Mi</p>
            <p>d</p>
          </div>
          <div class="K key" data-freq="349.23">
            <p>Fa</p>
            <p>f</p>
          </div>
          <div class="a key" data-freq="392.0">
            <p>So</p>
            <p>h</p>
          </div>
          <div class="S key" data-freq="440.0">
            <p>La</p>
            <p>j</p>
          </div>
          <div class="Q key" data-freq="493.88">
            <p>Ti</p>
            <p>k</p>
          </div>
          <div class="G key" data-freq="523.25">
            <p>Do</p>
            <p><link rel="manifest" href="manifest.json" /></p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
